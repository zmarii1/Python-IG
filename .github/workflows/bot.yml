name: Run paper_bot

on:
  schedule:
    # Minute 41, not 0: the top of the hour is GitHub's busiest time and
    # scheduled runs there get delayed or skipped
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Only one bot run at a time, so two runs never edit the wallet together
concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run the bot
        run: python Paper_Bot.py
      - name: Save the wallet back to the repo
        run: |
          git config user.name "paper_bot"
          git config user.email "paper_bot@users.noreply.github.com"
          git add wallet.json
          git commit -m "bot run $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing changed"
          git pull --rebase
          git push