name: Run paper_bot

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Only one bot run at a time, so two runs never edit the wallet together
concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the bot
        run: python Paper_Bot.py
      - name: Save the wallet back to the repo
        run: |
          git config user.name "paper_bot"
          git config user.email "paper_bot@users.noreply.github.com"
          git add wallet.json
          git commit -m "bot run $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing changed"
          git pull --rebase
          git push