name: Python check

on: [push]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for syntax errors
        run: python -m compileall .
      - name: Catch serious mistakes
        run: |
          pip install flake8
          flake8 . --select=E9,F63,F7,F82 --show-source
